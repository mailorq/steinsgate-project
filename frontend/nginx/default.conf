# контейнер опубликован только на loopback. в production этот заголовок может
# прийти лишь от TLS-прокси хоста, который обязан перезаписать клиентское
# значение. это сохраняет HTTPS-схему для django без доверия к интернет-клиенту
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 4173;
    listen [::]:4173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Лимит под загрузку аватаров (бэкенд принимает до 8 MB)
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # заголовки задаются только там, где отдает nginx: на /api/ и /admin/
    # их выставляет SecurityMiddleware, дублировать не нужно

    # хэшированные ассеты vite - кэшируются навсегда
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # изображения из public: без фолбэка в index.html
    location /img/ {
        include /etc/nginx/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # статика Django-админки: collectstatic пишет в общий volume
    location /static/ {
        include /etc/nginx/security-headers.conf;
        alias /srv/django-static/;
    }

    # файлы, загруженные пользователями. CSP срабатывает при прямом переходе
    # по ссылке и обезвреживает содержимое; загрузке через <img> он не мешает
    location /media/ {
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        alias /srv/django-media/;
    }

    # SPA: client-side routing
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https://kodikplayer.com https://www.anilibria.tv; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|admin)/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
