name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# новый пуш в ветку отменяет предыдущий незавершённый прогон
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # в чистом checkout нет .env, а настройки требуют явный ключ
      - name: Django checks and tests
        env:
          SECRET_KEY: secret-key-used-only-by-ci
          EMAIL_DELIVERY_QUOTA_SECRET: email-delivery-quota-secret-used-only-by-ci
          DEBUG: "False"
          HTTPS_ENABLED: "False"
        run: |
          python manage.py check
          python manage.py test

  deploy-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      # проверка боевого профиля: любое ослабление настроек роняет сборку
      - name: Django deployment checklist
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: steins.example.com
          CSRF_TRUSTED_ORIGINS: https://steins.example.com
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export EMAIL_DELIVERY_QUOTA_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level WARNING

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff==0.15.20
      - run: ruff check scripts
      - name: projectctl tests (включая реальный up/health/down)
        env:
          PROJECTCTL_INTEGRATION_UP: "1"
        run: python -m unittest discover -s scripts -p "test_*.py"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # конфиг периметра ломается только в рантайме, поэтому синтаксис проверяется тем же образом, что и в продакшене
      - name: Validate nginx configuration
        run: docker run --rm -v "$PWD/frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" -v "$PWD/frontend/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro" nginxinc/nginx-unprivileged:1.27-alpine nginx -t

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # секрет мог попасть в любой предыдущий коммит, нужна вся история
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner --exit-code 1
