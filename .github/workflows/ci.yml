name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# новый пуш в ветку отменяет предыдущий незавершённый прогон, кроме main:
# там прерванный publish оставил бы образы backend и frontend разных версий
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # в чистом checkout нет .env, а настройки требуют явный ключ
      - name: Django checks and tests
        env:
          SECRET_KEY: secret-key-used-only-by-ci
          EMAIL_DELIVERY_QUOTA_SECRET: email-delivery-quota-secret-used-only-by-ci
          DEBUG: "False"
          HTTPS_ENABLED: "False"
        run: |
          python manage.py check
          python manage.py test

  deploy-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      # проверка боевого профиля: любое ослабление настроек роняет сборку
      - name: Django deployment checklist
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: steins.example.com
          CSRF_TRUSTED_ORIGINS: https://steins.example.com
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export EMAIL_DELIVERY_QUOTA_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level WARNING

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install ruff==0.15.20
      - run: ruff check scripts
      - name: projectctl tests (включая реальный up/health/down)
        env:
          PROJECTCTL_INTEGRATION_UP: "1"
        run: python -m unittest discover -s scripts -p "test_*.py"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # конфиг периметра ломается только в рантайме, поэтому синтаксис проверяется тем же образом, что и в продакшене
      - name: Validate nginx configuration
        run: docker run --rm -v "$PWD/frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" -v "$PWD/frontend/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro" -v "$PWD/frontend/nginx/backend-upstream.conf:/etc/nginx/backend-upstream.conf:ro" nginxinc/nginx-unprivileged:1.27-alpine nginx -t

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # секрет мог попасть в любой предыдущий коммит, нужна вся история
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner --exit-code 1

  publish:
    # только после ВСЕХ проверок и только push в main: PR, форки и dev сюда не попадают
    needs: [backend, deploy-config, scripts, frontend, nginx, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # нативная сборка под ARM Ampere: бесплатные arm64-раннеры GitHub для публичных репозиториев,
    # без эмуляции QEMU. В приватном репозитории этот раннер недоступен
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main-<номер прогона>-<короткий sha>: по этому шаблону Flux выбирает новейший образ
      - id: tag
        run: echo "value=main-${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/mailorq/steinsgate-backend:${{ steps.tag.outputs.value }}
          labels: org.opencontainers.image.source=https://github.com/mailorq/steinsgate-project
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/mailorq/steinsgate-frontend:${{ steps.tag.outputs.value }}
          labels: org.opencontainers.image.source=https://github.com/mailorq/steinsgate-project
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
